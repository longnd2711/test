<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Màu gradient cam giống from-orange-400 to-orange-600 -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  
  <!-- Nền bo góc vuông -->
  <rect width="512" height="512" rx="120" fill="url(#orangeGrad)"/>
  
  <!-- Icon Layers từ Lucide (được phóng to và căn giữa) -->
  <g transform="translate(110, 110) scale(12)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 12 12 17 22 12"/>
    <polyline points="2 17 12 22 22 17"/>
  </g>
</svg>
